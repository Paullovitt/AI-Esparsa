[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-esparsa-v73"
version = "2.8.0"
description = "Gerador textual causal V7.3 com Q/K COO e FFN combinatoria"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Paulo Augusto" }]
dependencies = [
  "torch==2.11.0",
  "tokenizers==0.22.2",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["testes"]
addopts = "-ra"
