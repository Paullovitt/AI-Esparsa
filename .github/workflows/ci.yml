name: testes

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Compilar
        run: >-
          python -m compileall -q src testes
          executar_gerador_esparso_v73.py executar_multimodal_v8.py
          treinar_multimodal_v8.py
      - name: Testar
        env:
          CUDA_VISIBLE_DEVICES: "-1"
        run: python -m unittest discover -s testes -v
