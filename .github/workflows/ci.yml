name: testes

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Compilar
        run: >-
          python -m compileall -q src testes
          treinar_gerador_esparso.py executar_gerador_esparso.py
          validar_gerador_esparso.py promover_gerador_esparso.py
          comparar_esparso_denso.py validar_comparacao_esparso_denso.py
      - name: Testar
        run: python -m unittest discover -s testes -v
