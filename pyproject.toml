[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gerador-esparso-coerente"
version = "2.0.0"
description = "Gerador multimodal esparso com backbone combinatorio V7.3"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Paulo Augusto" }]
dependencies = ["torch==2.11.0", "Pillow==12.1.1"]

[tool.setuptools]
packages = ["src"]
