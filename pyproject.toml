[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gerador-esparso-coerente"
version = "1.1.0"
description = "Gerador procedural com Q/K e FFN estruturalmente esparsas"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Paulo Augusto" }]
dependencies = ["torch==2.11.0"]

[tool.setuptools]
packages = ["src"]
